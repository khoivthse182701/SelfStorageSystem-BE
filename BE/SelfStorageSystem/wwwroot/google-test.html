<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google Sign-In - Self Storage System</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: #1a73e8;
            font-size: 24px;
        }
        p {
            color: #5f6368;
            line-height: 1.5;
        }
        .btn-wrapper {
            margin: 24px 0;
            display: flex;
            justify-content: center;
        }
        .result-box {
            background: #282c34;
            color: #abb2bf;
            padding: 16px;
            border-radius: 8px;
            font-family: Consolas, monospace;
            font-size: 13px;
            overflow-x: auto;
            max-height: 300px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .status-success {
            background: #e6f4ea;
            color: #137333;
        }
        .status-error {
            background: #fce8e6;
            color: #c5221f;
        }
        .action-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 10px;
        }
        .action-btn:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Thử nghiệm Đăng nhập bằng Google</h2>
    <p>Trang này sử dụng Google Identity Services để lấy Google ID Token và gọi trực tiếp API <code>POST /api/auth/google-login</code> của Backend.</p>

    <div class="btn-wrapper">
        <div id="g_id_onload"
             data-client_id="928800899912-81ire3k9j09sibcegq1hriqgg231ahqr.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
    </div>

    <div id="statusContainer" style="display: none;">
        <div id="statusBadge" class="status-badge"></div>
        <div class="result-box" id="resultOutput"></div>
        <div id="extraActions" style="display: none; margin-top: 16px;">
            <button class="action-btn" onclick="testGetCurrentUser()">Thử gọi GET /api/auth/me với JWT vừa nhận</button>
        </div>
    </div>
</div>

<script>
    let currentJwtToken = '';

    async function handleCredentialResponse(response) {
        const statusContainer = document.getElementById('statusContainer');
        const statusBadge = document.getElementById('statusBadge');
        const resultOutput = document.getElementById('resultOutput');
        const extraActions = document.getElementById('extraActions');

        statusContainer.style.display = 'block';
        statusBadge.className = 'status-badge';
        statusBadge.textContent = 'Đang gửi Google ID Token lên Backend...';
        resultOutput.textContent = 'Google ID Token nhận được (rút gọn):\n' + response.credential.substring(0, 50) + '...\n\nĐang gọi POST /api/auth/google-login...';

        try {
            const res = await fetch('/api/auth/google-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    idToken: response.credential
                })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                currentJwtToken = data.data.accessToken;
                statusBadge.className = 'status-badge status-success';
                statusBadge.textContent = '✅ Đăng nhập Google thành công!';
                resultOutput.textContent = JSON.stringify(data, null, 2);
                extraActions.style.display = 'block';
            } else {
                statusBadge.className = 'status-badge status-error';
                statusBadge.textContent = '❌ Lỗi đăng nhập Google';
                resultOutput.textContent = JSON.stringify(data, null, 2);
            }
        } catch (err) {
            statusBadge.className = 'status-badge status-error';
            statusBadge.textContent = '❌ Không thể kết nối tới Backend';
            resultOutput.textContent = err.toString();
        }
    }

    async function testGetCurrentUser() {
        if (!currentJwtToken) return;
        const resultOutput = document.getElementById('resultOutput');
        resultOutput.textContent = 'Đang gọi GET /api/auth/me với Bearer Token...';

        try {
            const res = await fetch('/api/auth/me', {
                headers: {
                    'Authorization': 'Bearer ' + currentJwtToken
                }
            });
            const data = await res.json();
            resultOutput.textContent = 'Kết quả từ GET /api/auth/me:\n' + JSON.stringify(data, null, 2);
        } catch (err) {
            resultOutput.textContent = 'Lỗi gọi /api/auth/me: ' + err.toString();
        }
    }
</script>

</body>
</html>
